# Root Cargo workspace manifest.
#
# A "workspace" groups multiple packages (crates) so they share ONE target/
# directory and ONE Cargo.lock. This makes builds faster (dependencies compile
# once) and lets you run any binary from the workspace root.
#
# NOTE ON BINARY NAMES + VS Code shortcut:
#   Your keybinding runs `cargo run --bin ${fileBasenameNoExtension}`.
#   In a workspace, `--bin <name>` is only unambiguous when the binary name is
#   UNIQUE across every member crate. That is why every binary is prefixed with
#   its folder number, e.g. learn_10_01_hello. Never reuse a binary name and the
#   shortcut keeps working unchanged from anywhere in the workspace.
#
# Folder numbering uses gaps of 10 (learn_10_, learn_20_, ...) so we can insert a
# new topic later (e.g. learn_25_) WITHOUT renaming everything.

[workspace]
resolver = "3" # resolver v3 is the default for edition 2024

members = [
    "learn_10_core",
    "learn_20_ownership",
    "learn_30_structs_enums",
    "learn_40_collections_generics",
    "learn_50_traits",
    "learn_60_error_handling",
    "proj_10_cli_todo",
    "learn_70_modules_crates",
    "learn_80_closures_iterators",
    "learn_90_smart_pointers",
    "learn_100_lifetimes",
]

# Shared dependency versions live here so every member can reference them with
# `foo = { workspace = true }` and stay in sync.
[workspace.dependencies]
rand = "0.10.2"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
