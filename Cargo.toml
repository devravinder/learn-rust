# Root Cargo workspace manifest.
#
# A "workspace" groups multiple packages (crates) so they share ONE target/
# directory and ONE Cargo.lock. This makes builds faster (dependencies compile
# once) and lets you run any binary from the workspace root.
#
# NOTE ON BINARY NAMES + VS Code shortcut:
#   Your keybinding runs `cargo run --bin ${fileBasenameNoExtension}`.
#   In a workspace, `--bin <name>` is only unambiguous when the binary name is
#   UNIQUE across every member crate. That is why every binary is prefixed with
#   its folder number, e.g. learn_01_01_hello. Never reuse a binary name and the
#   shortcut keeps working unchanged from anywhere in the workspace.
#
# Folder numbering is sequential (learn_01_, learn_02_, ...) in learning order.
# Binaries are prefixed with their folder number so names stay globally unique.

[workspace]
resolver = "3" # resolver v3 is the default for edition 2024

members = [
    "concept_01_core",
    "concept_02_ownership",
    "concept_04_structs_enums",
    "concept_08_collections",
    "concept_06_traits",
    "concept_07_generics",
    "concept_05_error_handling",
    "proj_01_cli_todo",
    "concept_03_modules_crates",
    "concept_09_closures_iterators",
    "learn_09_smart_pointers",
    "learn_10_lifetimes",
    "proj_02_file_parser",
    "learn_11_concurrency",
    "learn_12_async_tokio",
    "learn_13_macros",
    "learn_13_proc_macro",
    "learn_14_unsafe_ffi",
    "proj_03_web_api_axum",
    "proj_04_grpc",
    "learn_01_core_relearn"
]

# Shared dependency versions live here so every member can reference them with
# `foo = { workspace = true }` and stay in sync.
[workspace.dependencies]
rand = "0.10.2"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
csv = "1.4.0"
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tonic = "0.14.6"
prost = "0.14.4"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"
