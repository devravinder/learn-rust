[package]
name = "proj_10_cli_todo"
version = "0.1.0"
edition = "2024"

# Single named binary so `cargo run --bin proj_10_cli_todo` stays unique in the
# workspace (keeps the VS Code shortcut convention consistent with the learn_* crates).
[[bin]]
name = "proj_10_cli_todo"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }        # CLI arg parsing (like commander/yargs)
serde = { workspace = true }       # (de)serialization framework
serde_json = { workspace = true }  # JSON format for serde
anyhow = { workspace = true }      # ergonomic error handling for the app
